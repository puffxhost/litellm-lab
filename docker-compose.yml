services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Loopback-only host port enables local model discovery.
    ports:
      - "127.0.0.1:11434:11434"

  litellm:
    image: docker.litellm.ai/berriai/litellm:latest
    restart: unless-stopped
    depends_on:
      - ollama
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    env_file:
      - .env
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  ollama_data:
